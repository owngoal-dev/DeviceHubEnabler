# Build the roothide and rootless packages without Theos, straight from
# Sources/*.m and apelin-project.json, and publish a GitHub Release with them
# and a SHA256SUMS. owngoal-packages indexes a repository's newest stable
# release, so the release is published, not left as a draft.
#
# A release is automatic: a push to main whose apelin-project.json names a
# version without a tag vX.Y.Z gets one, at that commit. Pushing the tag itself
# does the same and must name the committed version. A manual run
# (workflow_dispatch) only builds and audits, and uploads the packages as an
# artifact. Shape: prepare → build → release; prepare decides once whether to
# publish, release needs both and checks that a tag already there still names
# the commit that was built.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(jq -r .package.version apelin-project.json)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version '$version'" >&2; exit 1; }
          sha="$GITHUB_SHA"
          case "$GITHUB_REF_TYPE" in
            tag)
              [ "$GITHUB_REF_NAME" = "v$version" ] || {
                echo "tag $GITHUB_REF_NAME but apelin-project.json says $version" >&2; exit 1; }
              publish=true ;;
            branch)
              # main carries a version; a version without its tag gets released.
              if gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
                echo "v$version is tagged already: building only."
                publish=false
              else
                publish=true
              fi ;;
            *) publish=false ;;
          esac
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "sha=$sha"
          } >>"$GITHUB_OUTPUT"
          echo "### Release identity: $version at \`$sha\`, publish=$publish" >>"$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Select newest stable Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | grep -viE 'beta|rc' | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun clang --version | head -n1
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install packaging tools
        run: |
          brew install dpkg
          dpkg-deb --version | head -n1
          codesign --version

      - name: Build both packages
        run: bash Scripts/ci/build.sh

      - name: Audit control fields and identity
        run: bash Scripts/ci/audit.sh control

      - name: Audit root ownership
        run: bash Scripts/ci/audit.sh ownership

      - name: Audit dylib slices
        run: bash Scripts/ci/audit.sh slices

      - name: Audit dylib ad hoc signature
        # codesign's own words go into an annotation, which is readable without
        # the Actions log.
        run: |
          out="$(bash Scripts/ci/audit.sh signature 2>&1)" && printf '%s\n' "$out" || {
            printf '::error title=audit signature::%s\n' "$(printf '%s' "$out" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            exit 1
          }

      - name: Audit dylib has no entitlements
        run: bash Scripts/ci/audit.sh entitlements

      - name: Audit filter plist
        run: bash Scripts/ci/audit.sh filter

      - name: SHA256SUMS from exactly the released files
        working-directory: build
        run: |
          shasum -a 256 ./*.deb | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS

      - name: Job summary
        working-directory: build
        run: |
          {
            echo "### Packages $(jq -r .package.version ../apelin-project.json) (\`$GITHUB_SHA\`)"
            echo
            echo "| File | Architecture | Depends |"
            echo "| --- | --- | --- |"
            for deb in ./*.deb; do
              echo "| $(basename "$deb") | $(dpkg-deb -f "$deb" Architecture) | $(dpkg-deb -f "$deb" Depends) |"
            done
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: packages
          path: |
            build/*.deb
            build/SHA256SUMS
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: A tag already there still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if now="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            [ "$now" = "$SHA" ] || {
              echo "tag $tag names $now, built $SHA" >&2; exit 1; }
          fi

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages
          path: dist

      - name: Verify checksums and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          tag="v$VERSION"
          commit_message="$(gh api "repos/$GH_REPO/commits/$SHA" --jq .commit.message)"
          {
            echo "$commit_message"
            echo
            echo "Roothide (\`iphoneos-arm64e\`) and rootless (\`iphoneos-arm64\`, arm64 and arm64e) packages, built by this workflow from \`$SHA\`."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            # The release was created first, for example on the web; fill it in.
            gh release upload "$tag" ./*.deb SHA256SUMS --clobber
            gh release edit "$tag" --title "DeviceHubEnabler $VERSION" --notes-file release-notes.md
          elif gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh release create "$tag" ./*.deb SHA256SUMS --verify-tag \
              --title "DeviceHubEnabler $VERSION" --notes-file release-notes.md
          else
            gh release create "$tag" ./*.deb SHA256SUMS --target "$SHA" \
              --title "DeviceHubEnabler $VERSION" --notes-file release-notes.md
          fi
          echo "### Published release $tag at \`$SHA\`" >>"$GITHUB_STEP_SUMMARY"
